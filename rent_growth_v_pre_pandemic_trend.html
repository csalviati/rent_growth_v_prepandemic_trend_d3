<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rent Growth vs Pre-Pandemic Trend</title>

  <style>
    :root{
      --purple:#8434D6;
      --text:#111;
      --muted:#666;
      --bg:#ffffff;
    }

    html, body{
      height:100%;
      margin:0;
    }

    body{
      background:var(--bg);
      font-family: "Proxima Nova", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--text);
    }

    /* Fills the embedding iframe's actual height exactly -- title/controls/footer
       size to their content, and the chart (flex:1 below) stretches to take up
       whatever vertical space is left, so there's never leftover blank space at
       the bottom regardless of small rendering differences across browsers. */
    .wrap{
      width: 100%;
      max-width: 900px;
      height: 100%;
      margin: 0 auto;
      padding: 10px 14px 8px 14px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    .title{ flex: 0 0 auto; }
    .controls{ flex: 0 0 auto; }
    .footer{ flex: 0 0 auto; }

    label{
      font-size:17px;
      color:var(--muted);
    }

    .controls{
      display:flex;
      align-items:flex-end;
      justify-content:flex-start;
      gap:16px;
      margin: 6px 0 8px 0;
      flex-wrap:wrap;
    }
    .control-group{ display:flex; flex-direction:column; gap:3px; }
    .control-group label{ font-size:13px; font-weight:600; }

    /* Searchable geography combobox */
    .combo{
      position:relative;
      width: 300px;
      max-width: 100%;
    }
    .combo input{
      width:100%;
      box-sizing:border-box;
      font-size:15px;
      padding:5px 9px;
      border:1px solid rgba(0,0,0,0.2);
      border-radius:8px;
      background:#fff;
      font-family: inherit;
      color: var(--text);
    }
    .combo input:focus{
      outline: 2px solid rgba(132,52,214,0.35);
      border-color: var(--purple);
    }
    .combo-list{
      display:none;
      position:absolute;
      top: calc(100% + 4px);
      left:0;
      right:0;
      max-height: 240px;
      overflow-y:auto;
      background:#fff;
      border:1px solid rgba(0,0,0,0.2);
      border-radius:8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      z-index: 30;
    }
    .combo-option{
      padding:7px 9px;
      font-size:14px;
      cursor:pointer;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .combo-option.active{ background: rgba(132,52,214,0.12); }
    .combo-empty{ padding:7px 9px; font-size:14px; color:var(--muted); }

    select{
      font-size:15px;
      padding:5px 9px;
      border:1px solid rgba(0,0,0,0.2);
      border-radius:8px;
      background:#fff;
      font-family: inherit;
      color: var(--text);
      min-width: 200px;
    }

    #chart{ position:relative; width:100%; flex:1 1 auto; min-height:0; }
    #chart svg{ display:block; width:100%; height:100%; }

    .tooltip{
      position:absolute;
      pointer-events:none;
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 13px;
      line-height: 1.25;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      opacity: 0;
      white-space: nowrap;
    }

    .title{ text-align:left; margin: 2px 0 0 0; }
    .title .l1{ font-size:23px; font-weight:600; margin-bottom:2px; }
    .title .l2{ font-size:17px; font-weight:400; color:var(--text); }

    .footer{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-top:4px;
      gap:12px;
    }
    .source{ font-size:13px; color:var(--text); }
    .logo{ height:34px; width:auto; display:block; }

    svg text{ font-family: inherit; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>

<body>
  <div class="wrap">
    <div class="title">
      <div class="l1" id="titleL1">Median Rent: United States</div>
      <div class="l2">Actual vs. Pre-Pandemic Trend: 2017-Present</div>
    </div>

    <div id="chart"></div>

    <div class="controls">
      <div class="control-group">
        <label for="locSearch">Select geography</label>
        <div class="combo" id="locCombo">
          <input type="text" id="locSearch" autocomplete="off" placeholder="Type to search…" />
          <div class="combo-list" id="locList"></div>
        </div>
      </div>
      <div class="control-group">
        <label for="basisSelect">Compare to</label>
        <select id="basisSelect">
          <option value="natl" selected>National average trend</option>
          <option value="own">Market-specific trend</option>
        </select>
      </div>
    </div>

    <div class="footer">
      <div class="source">Source: Apartment List</div>
      <img class="logo" src="Apartment_List_Logo_RGB%20crop.png" alt="Apartment List logo" />
    </div>
  </div>

<script>
(async function() {
  const PURPLE = "#8434D6";
  const CSV_PATH = "final_df.csv";
  const AXIS_FONT_SIZE = 17;
  const DASH_TREND = "9 5";
  const TYPE_ORDER = { National: 0, Metro: 1, State: 2, City: 3 };

  const height = 440;
  const margin = { top: 18, right: 16, bottom: 42, left: 62 };
  const innerH = height - margin.top - margin.bottom;

  const container = d3.select("#chart");
  const tooltip = container.append("div").attr("class", "tooltip");

  const fmtMonth = d3.timeFormat("%b %Y");
  const fmtDollar0 = (v) => d3.format("$,.0f")(v);
  const fmtPct = d3.format("+.1%");
  const num = (v) => (v === "" || v == null ? null : +v);

  const raw = (await d3.csv(CSV_PATH, d => {
    // Guard against stray/blank rows at the end of the CSV export (e.g. scratch
    // values with no location_id/type/date) -- without this, an empty
    // location_id string coerces to 0 via `+d.location_id` and gets folded
    // into the National series, corrupting its line with bogus points.
    if (!d.location_type || !d.location_name || d.year === "" || d.month === "" || d.location_id === "") {
      return null;
    }
    return {
      location_id: +d.location_id,
      location_type: d.location_type,
      location_name: d.location_name,
      year: +d.year,
      month: +d.month,
      date: new Date(+d.year, (+d.month - 1), 1),
      price_all_actual: num(d.price_all_actual),
      price_all_prepan_trnd: num(d.price_all_prepan_trnd),
      price_all_prepan_trnd_natl: num(d.price_all_prepan_trnd_natl)
    };
  })).filter(d => d != null && !isNaN(d.date));

  const locMeta = new Map();
  raw.forEach(d => {
    if (!locMeta.has(d.location_id)) {
      locMeta.set(d.location_id, { type: d.location_type, name: d.location_name });
    }
  });

  const locations = Array.from(locMeta, ([id, meta]) => ({ id, type: meta.type, name: meta.name }))
    .sort((a, b) => {
      const ta = TYPE_ORDER[a.type] ?? 99;
      const tb = TYPE_ORDER[b.type] ?? 99;
      if (ta !== tb) return ta - tb;
      return (a.name || "").localeCompare(b.name || "");
    });

  const labelFor = (loc) => `${loc.type} – ${loc.name}`;

  // ---- Searchable combobox ----
  const comboInput = document.getElementById("locSearch");
  const comboList = document.getElementById("locList");
  let activeIndex = -1;
  let filtered = locations;

  function filterLocations(q){
    const query = q.trim().toLowerCase();
    if (!query) return locations;
    return locations.filter(loc => labelFor(loc).toLowerCase().includes(query));
  }

  function renderList(items){
    comboList.innerHTML = "";
    if (items.length === 0){
      const empty = document.createElement("div");
      empty.className = "combo-empty";
      empty.textContent = "No matches";
      comboList.appendChild(empty);
      comboList.style.display = "block";
      return;
    }
    items.forEach((loc, i) => {
      const opt = document.createElement("div");
      opt.className = "combo-option" + (i === activeIndex ? " active" : "");
      opt.textContent = labelFor(loc);
      opt.addEventListener("mousedown", (e) => {
        e.preventDefault();
        selectLocation(loc);
      });
      comboList.appendChild(opt);
    });
    comboList.style.display = "block";
  }

  function scrollActiveIntoView(){
    const el = comboList.children[activeIndex];
    if (el) el.scrollIntoView({ block: "nearest" });
  }

  function selectLocation(loc){
    comboInput.value = labelFor(loc);
    comboList.style.display = "none";
    comboInput.blur();
    update(loc.id);
  }

  // Opening the combobox (focus or click) always shows the FULL list, not one
  // filtered by whatever is currently selected -- and selects all the input's
  // text so the first keystroke replaces it instead of appending to it.
  function openFullList(){
    activeIndex = -1;
    filtered = locations;
    renderList(filtered);
  }

  comboInput.addEventListener("focus", () => {
    openFullList();
    setTimeout(() => comboInput.select(), 0);
  });

  comboInput.addEventListener("click", () => {
    if (comboList.style.display !== "block") openFullList();
    comboInput.select();
  });

  comboInput.addEventListener("input", () => {
    activeIndex = -1;
    filtered = filterLocations(comboInput.value);
    renderList(filtered);
  });

  comboInput.addEventListener("keydown", (e) => {
    if (comboList.style.display === "none" && e.key !== "Escape") {
      filtered = filterLocations(comboInput.value);
      renderList(filtered);
    }
    if (e.key === "ArrowDown"){
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, filtered.length - 1);
      renderList(filtered);
      scrollActiveIntoView();
    } else if (e.key === "ArrowUp"){
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      renderList(filtered);
      scrollActiveIntoView();
    } else if (e.key === "Enter"){
      e.preventDefault();
      if (activeIndex >= 0 && filtered[activeIndex]) selectLocation(filtered[activeIndex]);
    } else if (e.key === "Escape"){
      comboList.style.display = "none";
    }
  });

  document.addEventListener("click", (e) => {
    if (!document.getElementById("locCombo").contains(e.target)){
      comboList.style.display = "none";
    }
  });

  const titleEl = document.getElementById("titleL1");

  // preserveAspectRatio="none" + CSS width:100%/height:100% (set on #chart svg)
  // let the chart stretch to fill exactly whatever vertical space the flex
  // layout gives it, instead of a fixed aspect ratio that can leave (or run
  // short of) blank space depending on the embedding iframe's real height.
  const svg = container.append("svg")
    .attr("role", "img")
    .attr("aria-label", "Rent trend chart")
    .attr("viewBox", `0 0 900 ${height}`)
    .attr("preserveAspectRatio", "none");

  const viewW = 900;
  const innerW = viewW - margin.left - margin.right;

  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const x = d3.scaleTime().range([0, innerW]);
  const y = d3.scaleLinear().range([innerH, 0]);

  const grid = g.append("g").attr("class", "grid");
  const gx = g.append("g").attr("transform", `translate(0,${innerH})`);
  const gy = g.append("g");

  function computeYDomain(data, isNational){
    const vals = [];
    data.forEach(d => {
      if (d.price_all_actual != null) vals.push(d.price_all_actual);
      if (d.trendVal != null) vals.push(d.trendVal);
    });
    if (vals.length === 0) return [0, 1];
    const [lo, hi] = d3.extent(vals);
    if (lo === hi) return [lo - 1, hi + 1];
    const pad = (hi - lo) * 0.08;
    return [lo - pad, hi + pad];
  }

  function renderAxes(xDomain, data, isNational){
    x.domain(xDomain);
    y.domain(computeYDomain(data, isNational)).nice();

    const yTicks = y.ticks(6);
    const years = d3.timeYears(d3.timeYear.floor(xDomain[0]), d3.timeYear.ceil(xDomain[1]));

    gx.call(d3.axisBottom(x).tickValues(years).tickFormat(d3.timeFormat("%Y")).tickSizeOuter(0));
    gx.selectAll(".tick line").attr("y2", 6).attr("stroke", "#111");
    gx.selectAll(".domain").attr("stroke", "rgba(0,0,0,0.25)");
    gx.selectAll("text").attr("font-size", AXIS_FONT_SIZE);

    gy.call(d3.axisLeft(y).tickValues(yTicks).tickFormat(fmtDollar0).tickSizeOuter(0));
    gy.selectAll(".domain").remove();
    gy.selectAll(".tick line").remove();
    gy.selectAll("text").attr("font-size", AXIS_FONT_SIZE);

    grid.selectAll("line")
      .data(yTicks)
      .join("line")
      .attr("x1", 0).attr("x2", innerW)
      .attr("y1", d => y(d)).attr("y2", d => y(d))
      .attr("stroke", "rgba(0,0,0,0.10)")
      .attr("shape-rendering", "crispEdges");
  }

  const lineActual = d3.line().defined(d => d.price_all_actual != null).x(d => x(d.date)).y(d => y(d.price_all_actual));
  const lineTrend = d3.line().defined(d => d.trendVal != null).x(d => x(d.date)).y(d => y(d.trendVal));

  const pathActual = g.append("path").attr("fill", "none").attr("stroke", PURPLE).attr("stroke-width", 2);
  const pathTrend = g.append("path").attr("fill", "none").attr("stroke", PURPLE).attr("stroke-width", 2).attr("stroke-dasharray", DASH_TREND);

  const legend = g.append("g").attr("transform", `translate(${12},${10})`);
  const legendBg = legend.append("rect").attr("rx", 8).attr("ry", 8).attr("fill", "rgba(255,255,255,0.92)");
  const legendRows = legend.append("g");

  function renderLegend(items){
    const rowH = 26;
    const width = 230;
    const legendHeight = 8 + items.length * rowH + 6;
    legendBg.attr("x", -8).attr("y", -10).attr("width", width).attr("height", legendHeight);

    const rows = legendRows.selectAll("g.leg-row").data(items, d => d.label);
    rows.exit().remove();
    const rowsEnter = rows.enter().append("g").attr("class", "leg-row");
    rowsEnter.append("line");
    rowsEnter.append("text");
    const rowsMerged = rowsEnter.merge(rows);
    rowsMerged.attr("transform", (d, i) => `translate(0, ${4 + i * rowH})`);
    rowsMerged.select("line")
      .attr("x1", 0).attr("x2", 50).attr("y1", 0).attr("y2", 0)
      .attr("stroke", PURPLE).attr("stroke-width", 3)
      .attr("stroke-dasharray", d => d.dash || null);
    rowsMerged.select("text").attr("x", 58).attr("y", 5).attr("font-size", 17).text(d => d.label);
  }

  const hover = g.append("g").style("display", "none");
  hover.append("line").attr("class", "hover-line").attr("y1", 0).attr("y2", innerH).attr("stroke", "rgba(0,0,0,0.25)").attr("stroke-width", 1);
  const dotA = hover.append("circle").attr("r", 4).attr("fill", PURPLE);
  const dotT = hover.append("circle").attr("r", 4).attr("fill", PURPLE);

  const overlay = g.append("rect").attr("fill", "transparent").attr("width", innerW).attr("height", innerH);

  let current = [];
  let isNational = true;
  let currentBasis = "natl"; // "natl" | "own"

  function trendLabelFor(meta){
    if (meta.type === "National") return "Pre-pandemic trend";
    return currentBasis === "natl" ? "Pre-pandemic trend (National average)" : `Pre-pandemic trend (${meta.type}-specific)`;
  }

  function update(locationId){
    const id = +locationId;
    const meta = locMeta.get(id) || { type: "National", name: "United States" };
    isNational = meta.type === "National";

    current = raw.filter(d => d.location_id === id).sort((a,b)=>a.date-b.date).map(d => ({
      ...d,
      trendVal: currentBasis === "natl" ? d.price_all_prepan_trnd_natl : d.price_all_prepan_trnd
    }));

    titleEl.textContent = `Median Rent: ${meta.name}`;

    const xDomain = d3.extent(current, d => d.date);
    renderAxes(xDomain, current, isNational);

    pathActual.attr("d", lineActual(current));
    pathTrend.attr("d", lineTrend(current));

    renderLegend([
      { label: "Actual", dash: null },
      { label: trendLabelFor(meta), dash: DASH_TREND }
    ]);

    hover.style("display", "none");
    tooltip.style("opacity", 0);
  }

  const bisect = d3.bisector(d => d.date).left;

  overlay.on("mousemove", function(event){
    const [mx] = d3.pointer(event, this);
    const date = x.invert(mx);

    const i = bisect(current, date, 1);
    const a = current[i - 1];
    const b = current[i];
    if (!a || !b) return;
    const d = (date - a.date) > (b.date - date) ? b : a;
    const xPos = x(d.date);

    const ya = d.price_all_actual != null ? y(d.price_all_actual) : null;
    const yt = d.trendVal != null ? y(d.trendVal) : null;

    hover.style("display", null);
    hover.select(".hover-line").attr("x1", xPos).attr("x2", xPos);
    if (ya != null){ dotA.attr("cx", xPos).attr("cy", ya).style("display", null); } else { dotA.style("display", "none"); }
    if (yt != null){ dotT.attr("cx", xPos).attr("cy", yt).style("display", null); } else { dotT.style("display", "none"); }

    const meta = locMeta.get(d.location_id);
    const pctDiff = (d.price_all_actual != null && d.trendVal) ? (d.price_all_actual / d.trendVal - 1) : null;

    const lines = [
      `<div><b>${fmtMonth(d.date)}</b></div>`,
      ya != null ? `<div>Actual: <b>${fmtDollar0(d.price_all_actual)}</b></div>` : "",
      yt != null ? `<div>If trend continued: <b>${fmtDollar0(d.trendVal)}</b></div>` : "",
      pctDiff != null ? `<div>Difference: <b>${fmtPct(pctDiff)}</b></div>` : ""
    ].filter(Boolean).join("");

    tooltip.html(lines);

    const bbox = container.node().getBoundingClientRect();
    const svgBox = svg.node().getBoundingClientRect();
    const ttRect = tooltip.node().getBoundingClientRect();

    const pointX = (svgBox.left - bbox.left) + margin.left + xPos;
    const yCandidates = [ya, yt].filter(v => v != null);
    const pointY = (svgBox.top - bbox.top) + margin.top + (yCandidates.length ? Math.min(...yCandidates) : innerH/2);

    const gap = 10;
    let left = pointX - ttRect.width / 2;
    left = Math.max(4, Math.min(left, bbox.width - ttRect.width - 4));
    let top = pointY - ttRect.height - gap;
    top = Math.max(4, top);

    tooltip.style("left", `${left}px`).style("top", `${top}px`).style("opacity", 1);
  });

  overlay.on("mouseleave", function(){
    hover.style("display", "none");
    tooltip.style("opacity", 0);
  });

  document.getElementById("basisSelect").addEventListener("change", (e) => {
    currentBasis = e.target.value;
    const currentId = current.length ? current[0].location_id : 0;
    update(currentId);
  });

  const initial = locations.find(l => l.id === 0) || locations[0];
  comboInput.value = labelFor(initial);
  update(initial.id);

})();
</script>
</body>
</html>
