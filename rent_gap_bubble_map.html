<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rent Gap Bubble Map</title>

  <style>
    .viz-root{
      color-scheme: light;
      --surface-1:      #ffffff;
      --page-plane:     #ffffff;
      --text-primary:   #0b0b0b;
      --text-secondary: #52514e;
      --text-muted:     #898781;
      --border:         rgba(11,11,11,0.10);
      --purple:         #8434D6;
      --land:           #e8e4da;
      --state-line:     #cfc9ba;
    }

    html, body{
      height:100%;
      margin:0;
    }

    body{
      background:var(--page-plane);
      font-family: "Proxima Nova", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--text-primary);
    }

    /* Fills the embedding iframe's actual height exactly -- title/controls/legend/
       footer size to their content, and the map (flex:1 on #chart) stretches to
       take up whatever vertical space is left, so there's no leftover blank space
       at the bottom regardless of small rendering differences across browsers. */
    .wrap{
      width: 100%;
      max-width: 980px;
      height: 100%;
      margin: 0 auto;
      padding: 10px 14px 8px 14px;
      box-sizing: border-box;
      background: var(--surface-1);
      display: flex;
      flex-direction: column;
    }
    .title{ flex: 0 0 auto; }
    .controls{ flex: 0 0 auto; }
    .color-legend{ flex: 0 0 auto; }
    .footer{ flex: 0 0 auto; }

    .title{ text-align:left; margin: 2px 0 0 0; }
    .title .l1{ font-size:23px; font-weight:600; margin-bottom:2px; }
    .title .l2{ font-size:17px; font-weight:400; color:var(--text-secondary); }

    .controls{
      display:flex;
      align-items:flex-end;
      gap:14px;
      flex-wrap:nowrap;
      margin: 8px 0 6px 0;
    }
    .control-group{ display:flex; flex-direction:column; gap:3px; flex:1 1 0; min-width:0; }
    .control-group label{ font-size:12px; color:var(--text-secondary); font-weight:600; }
    select{
      font-size:13px; padding:5px 7px; border:1px solid rgba(0,0,0,0.2);
      border-radius:8px; background:#fff; font-family:inherit; color:var(--text-primary);
      width:100%; box-sizing:border-box;
    }

    #chart{ position:relative; width:100%; flex:1 1 auto; min-height:0; }
    #chart svg{ width:100%; height:100%; display:block; }

    .state-shape{ stroke: var(--state-line); stroke-width: 1; }
    .bubble{ stroke: var(--surface-1); stroke-width: 1; cursor: pointer; }

    .color-legend{
      display:flex; align-items:center; gap:8px; font-size:12px;
      color:var(--text-secondary); margin: 4px 0 0 0;
    }
    .color-legend .ramp{ width:150px; height:9px; border-radius:5px; }

    .tooltip{
      position:absolute;
      pointer-events:none;
      background: rgba(255,255,255,0.96);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 13px;
      line-height: 1.3;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      opacity: 0;
      white-space: nowrap;
      z-index: 40;
    }

    .footer{
      display:flex; align-items:center; justify-content:space-between;
      margin-top:6px; gap:12px;
    }
    .source{ font-size:13px; color:var(--text-secondary); }
    .logo{ height:34px; width:auto; display:block; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
</head>

<body>
  <div class="wrap viz-root" id="vizRoot">
    <div class="title">
      <div class="l1" id="titleL1">Median Rent vs. Pre-Pandemic Trend</div>
      <div class="l2" id="titleL2">Loading…</div>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="typeSelect">Location type</label>
        <select id="typeSelect">
          <option value="Metro" selected>Metro</option>
          <option value="State">State</option>
          <option value="City">City</option>
        </select>
      </div>
      <div class="control-group">
        <label for="basisSelect">Compare to</label>
        <select id="basisSelect">
          <option value="natl" selected>National average trend</option>
          <option value="own">Market-specific trend</option>
        </select>
      </div>
    </div>

    <div id="chart"></div>

    <div class="color-legend">
      <span>Below trend</span>
      <span class="ramp" id="colorRamp"></span>
      <span>Above trend</span>
    </div>

    <div class="footer">
      <div class="source">Source: Apartment List</div>
      <img class="logo" src="Apartment_List_Logo_RGB%20crop.png" alt="Apartment List logo" />
    </div>

  function guessMetroCoord(name){
    const commaIdx = name.indexOf(",");
    if (commaIdx < 0) return null;
    const cityPart = name.slice(0, commaIdx);
    const statePart = name.slice(commaIdx + 1).trim();
    const firstState = statePart.split("-")[0].trim();
    const cityCandidates = cityPart.split("/")[0].split("-");
    for (const cand of cityCandidates){
      const key = `${cand.trim()}, ${firstState}`;
      if (CITY_COORDS[key]) return CITY_COORDS[key];
    }
    return null;
  }

    svg.attr("viewBox", `0 0 ${w} ${h}`);
    projection.fitSize([w, h], statesGeo);
    stateShapes.attr("d", path);
  }

  const RDBU_11 = [
    "#053061", "#2166ac", "#4393c3", "#92c5de", "#d1e5f0", "#f7f7f7",
    "#fddbc7", "#f4a582", "#d6604d", "#b2182b", "#67001f"
  ];
  const colorScale = d3.scaleDiverging()
    .interpolator(t => d3.interpolateRgbBasis(RDBU_11)(t))
    .clamp(true);

  document.getElementById("colorRamp").style.background = `linear-gradient(to right, ${RDBU_11.join(", ")})`;

  const radiusScale = d3.scaleSqrt().range([3, 22]);

  function positionTooltip(event){
    const bbox = container.node().getBoundingClientRect();
    const ttRect = tooltip.node().getBoundingClientRect();
    let left = event.clientX - bbox.left + 14;
    let top = event.clientY - bbox.top + 14;
    left = Math.max(4, Math.min(left, bbox.width - ttRect.width - 4));
    tooltip.style("left", `${left}px`).style("top", `${top}px`);
  }

  function tooltipHtml(d){
    const trendLabel = currentBasis === "natl" ? "National average trend" : "Market-specific trend";
    const trendVal = currentBasis === "natl" ? d.trendNatl : d.trendOwn;
    return `<div><b>${d.location_name}</b></div>` +
      `<div>Actual: <b>${fmtDollar0(d.actual)}</b></div>` +
      `<div>${trendLabel}: <b>${fmtDollar0(trendVal)}</b></div>` +
      `<div>Difference: <b>${fmtPct(d.value)}</b></div>`;
  }

  function render(){
    const basisKey = currentBasis === "natl" ? "diffNatl" : "diffOwn";
    const data = byLocation
      .filter(d => d.location_type === currentType && d[basisKey] != null && d.coord)
      .map(d => ({ ...d, value: d[basisKey] }));

    document.getElementById("titleL1").textContent = `Median Rent vs. Pre-Pandemic Trend: ${currentType}s`;
    document.getElementById("titleL2").textContent =
      `Percentage gap between actual and pre-pandemic trend, ${latestLabel}`;

    const absVals = data.map(d => Math.abs(d.value)).sort(d3.ascending);
    const domainMax = (absVals.length ? d3.quantile(absVals, 0.9) : null) || d3.max(absVals) || 0.01;
    colorScale.domain([-domainMax, 0, domainMax]);

    const isState = currentType === "State";

    if (isState){
      gBubbles.selectAll("circle.bubble").remove();
      const byName = new Map(data.map(d => [d.location_name, d]));

      stateShapes
        .style("fill", d => {
          const name = stateNameForFeature(d);
          const match = name ? byName.get(name) : null;
          return match ? colorScale(match.value) : "var(--land)";
        })
        .style("cursor", d => {
          const name = stateNameForFeature(d);
          return name && byName.has(name) ? "pointer" : "default";
        })
        .on("mouseenter", function(event, d){
          const name = stateNameForFeature(d);
          const match = name ? byName.get(name) : null;
          if (!match) return;
          d3.select(this).attr("stroke-width", 2);
          tooltip.html(tooltipHtml(match));
          positionTooltip(event);
          tooltip.style("opacity", 1);
        })
        .on("mousemove", function(event, d){
          const name = stateNameForFeature(d);
          if (name && byName.has(name)) positionTooltip(event);
        })
        .on("mouseleave", function(){
          d3.select(this).attr("stroke-width", 1);
          tooltip.style("opacity", 0);
        });
    } else {
      stateShapes
        .style("fill", "var(--land)")
        .style("cursor", "default")
        .on("mouseenter", null)
        .on("mousemove", null)
        .on("mouseleave", null);

      const pops = data.map(d => d.population || 0);
      radiusScale.domain([0, d3.max(pops) || 1]);

      const bubbles = gBubbles.selectAll("circle.bubble").data(data, d => d.location_id);
      bubbles.exit().remove();
      const bubblesEnter = bubbles.enter().append("circle").attr("class", "bubble");
      bubblesEnter.merge(bubbles)
        .attr("cx", d => projection(d.coord.slice().reverse())[0])
        .attr("cy", d => projection(d.coord.slice().reverse())[1])
        .attr("r", d => radiusScale(d.population || 0))
        .attr("fill", d => colorScale(d.value))
        .attr("fill-opacity", 0.85)
        .on("mouseenter", function(event, d){
          d3.select(this).attr("stroke-width", 2);
          tooltip.html(tooltipHtml(d));
          positionTooltip(event);
          tooltip.style("opacity", 1);
        })
        .on("mousemove", positionTooltip)
        .on("mouseleave", function(){
          d3.select(this).attr("stroke-width", 1);
          tooltip.style("opacity", 0);
        });
    }
  }

  document.getElementById("typeSelect").addEventListener("change", (e) => { currentType = e.target.value; render(); });
  document.getElementById("basisSelect").addEventListener("change", (e) => { currentBasis = e.target.value; render(); });

  function refresh(){
    fitProjection();
    render();
  }

  refresh();
  window.addEventListener("resize", refresh);
})();
</script>
</body>
</html>
