<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rent Gap vs. Pre-Pandemic Trend</title>

  <style>
    .viz-root{
      color-scheme: light;
      --surface-1:      #fcfcfb;
      --page-plane:     #f9f9f7;
      --text-primary:   #0b0b0b;
      --text-secondary: #52514e;
      --text-muted:     #898781;
      --gridline:       #e1e0d9;
      --baseline:       #c3c2b7;
      --pos:            #e34948; /* above trend (red pole) */
      --neg:            #2a78d6; /* below trend (blue pole) */
      --border:         rgba(11,11,11,0.10);
      --purple:         #8434D6;
    }

    body{
      margin:0;
      background:var(--page-plane);
      font-family: "Proxima Nova", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--text-primary);
    }

    .wrap{
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 16px 12px 16px;
      box-sizing: border-box;
      background: var(--surface-1);
    }

    .title{ text-align:left; margin: 4px 0 0 0; }
    .title .l1{ font-size:24px; font-weight:600; margin-bottom:2px; }
    .title .l2{ font-size:18px; font-weight:400; color:var(--text-secondary); }

    .controls{
      display:flex;
      align-items:flex-end;
      gap:20px;
      flex-wrap:wrap;
      margin: 16px 0 14px 0;
    }
    .control-group{ display:flex; flex-direction:column; gap:4px; }
    .control-group label{
      font-size:14px;
      color:var(--text-secondary);
      font-weight:600;
    }
    select{
      font-size:16px;
      padding:6px 10px;
      border:1px solid rgba(0,0,0,0.2);
      border-radius:8px;
      background:#fff;
      font-family: inherit;
      color: var(--text-primary);
      min-width: 160px;
    }
    .segmented{
      display:inline-flex;
      border:1px solid rgba(0,0,0,0.2);
      border-radius:8px;
      overflow:hidden;
    }
    .segmented button{
      font-family: inherit;
      font-size:15px;
      padding:6px 14px;
      border:none;
      background:#fff;
      color: var(--text-secondary);
      cursor:pointer;
    }
    .segmented button + button{ border-left:1px solid rgba(0,0,0,0.15); }
    .segmented button.active{
      background: var(--purple);
      color:#fff;
    }

    .legend{
      display:flex;
      gap:18px;
      align-items:center;
      margin: 0 0 6px 0;
      font-size:14px;
      color: var(--text-secondary);
    }
    .legend .swatch{
      display:inline-block;
      width:12px; height:12px;
      border-radius:3px;
      margin-right:6px;
      vertical-align:middle;
    }

    #chart{ position:relative; width:100%; }

    .row-label{
      font-size:14px;
      fill: var(--text-primary);
    }
    .value-label{
      font-size:13px;
      fill: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .axis text{
      font-size:13px;
      fill: var(--text-muted);
    }
    .axis path, .axis line{ stroke: var(--baseline); }
    .gridline{ stroke: var(--gridline); shape-rendering: crispEdges; }

    .bar-row-bg{ fill: transparent; }
    .bar-row-bg.hover{ fill: rgba(11,11,11,0.035); }

    .tooltip{
      position:absolute;
      pointer-events:none;
      background: rgba(255,255,255,0.96);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      line-height: 1.3;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      opacity: 0;
      white-space: nowrap;
      z-index: 40;
    }

    .footer{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-top:16px;
      gap:12px;
    }
    .source{ font-size:14px; color:var(--text-secondary); }
    .logo{ height:36px; width:auto; display:block; }

    .note{
      font-size:13px;
      color: var(--text-muted);
      margin: 10px 0 0 0;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>

<body>
  <div class="wrap viz-root" id="vizRoot">
    <div class="title">
      <div class="l1" id="titleL1">Where Rents Sit Above or Below the Pre-Pandemic Trend</div>
      <div class="l2" id="titleL2">Loading…</div>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="typeSelect">Location type</label>
        <select id="typeSelect">
          <option value="Metro" selected>Metro (50 largest)</option>
          <option value="State">State</option>
          <option value="City">City (100 largest)</option>
        </select>
      </div>
      <div class="control-group">
        <label>Compare to</label>
        <div class="segmented" id="basisToggle">
          <button data-basis="natl" class="active">National average extrapolation</button>
          <button data-basis="own">Market-specific extrapolation</button>
        </div>
      </div>
    </div>

    <div class="legend">
      <span><span class="swatch" style="background:var(--pos)"></span>Actual above trend</span>
      <span><span class="swatch" style="background:var(--neg)"></span>Actual below trend</span>
    </div>

    <div id="chart"></div>

    <div class="note" id="note"></div>

    <div class="footer">
      <div class="source">Source: Apartment List</div>
      <img class="logo" src="Apartment_List_Logo_RGB%20crop.png" alt="Apartment List logo" />
    </div>
  </div>

<script>
(async function() {
  const CSV_PATH = "final_df.csv";
  const num = (v) => (v === "" || v == null ? null : +v);
  const fmtMonthYear = d3.timeFormat("%B %Y");
  const fmtPct = d3.format("+.1%");

  const raw = await d3.csv(CSV_PATH, d => ({
    location_id: +d.location_id,
    location_type: d.location_type,
    location_name: d.location_name,
    date: new Date(+d.year, (+d.month - 1), 1),
    price_all_actual: num(d.price_all_actual),
    price_all_prepan_trnd: num(d.price_all_prepan_trnd),
    price_all_prepan_trnd_natl: num(d.price_all_prepan_trnd_natl)
  }));

  // Identify the most current month dynamically
  const latestDate = d3.max(raw, d => d.date);
  document.getElementById("titleL2").textContent =
    `% difference from pre-pandemic trend, ${fmtMonthYear(latestDate)}`;

  const latestRows = raw.filter(d => d.date.getTime() === latestDate.getTime());

  // One row per location for the latest month, with both comparison ratios computed
  const byLocation = latestRows
    .filter(d => d.location_type !== "National")
    .map(d => {
      const diffOwn = (d.price_all_actual != null && d.price_all_prepan_trnd)
        ? d.price_all_actual / d.price_all_prepan_trnd - 1 : null;
      const diffNatl = (d.price_all_actual != null && d.price_all_prepan_trnd_natl)
        ? d.price_all_actual / d.price_all_prepan_trnd_natl - 1 : null;
      return {
        location_id: d.location_id,
        location_type: d.location_type,
        location_name: d.location_name,
        diffOwn, diffNatl
      };
    });

  // ---- State ----
  let currentType = "Metro";
  let currentBasis = "natl"; // "natl" | "own"

  const container = d3.select("#chart");
  const tooltip = container.append("div").attr("class", "tooltip");

  const margin = { top: 8, right: 70, bottom: 34, left: 230 };
  const rowH = 22;      // <=24px bar band, per spec
  const barThick = 16;  // actual bar thickness within the row
  const viewW = 860;
  const innerW = viewW - margin.left - margin.right;

  const svg = container.append("svg")
    .attr("role", "img")
    .attr("aria-label", "Ranked bar chart of rent gap vs. pre-pandemic trend")
    .style("width", "100%")
    .style("height", "auto");

  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
  const gGrid = g.append("g").attr("class", "gridlines");
  const gBars = g.append("g").attr("class", "bars");
  const gLabels = g.append("g").attr("class", "labels");
  const gAxis = g.append("g").attr("class", "axis");
  const baselineLine = g.append("line").attr("class", "axis");

  const x = d3.scaleLinear();

  function roundedBarPath(xZero, xVal, yTop, yBot, r){
    const positive = xVal >= xZero;
    const rr = Math.min(r, Math.abs(xVal - xZero) / 2 || r, (yBot - yTop) / 2);
    if (positive){
      const x0 = xZero, x1 = xVal;
      if (x1 - x0 < rr * 2) {
        return `M${x0},${yTop} L${x1},${yTop} L${x1},${yBot} L${x0},${yBot} Z`;
      }
      return `M${x0},${yTop} L${x1 - rr},${yTop} Q${x1},${yTop} ${x1},${yTop + rr} L${x1},${yBot - rr} Q${x1},${yBot} ${x1 - rr},${yBot} L${x0},${yBot} Z`;
    } else {
      const x0 = xZero, x1 = xVal;
      if (x0 - x1 < rr * 2) {
        return `M${x0},${yTop} L${x1},${yTop} L${x1},${yBot} L${x0},${yBot} Z`;
      }
      return `M${x0},${yTop} L${x1 + rr},${yTop} Q${x1},${yTop} ${x1},${yTop + rr} L${x1},${yBot - rr} Q${x1},${yBot} ${x1 + rr},${yBot} L${x0},${yBot} Z`;
    }
  }

  function truncate(str, maxChars){
    if (str.length <= maxChars) return str;
    return str.slice(0, Math.max(0, maxChars - 1)).trimEnd() + "…";
  }

  function render(){
    const basisKey = currentBasis === "natl" ? "diffNatl" : "diffOwn";
    let data = byLocation
      .filter(d => d.location_type === currentType && d[basisKey] != null)
      .map(d => ({ ...d, value: d[basisKey] }))
      .sort((a, b) => b.value - a.value);

    const n = data.length;
    const innerH = n * rowH;
    const totalH = innerH + margin.top + margin.bottom;

    svg.attr("viewBox", `0 0 ${viewW} ${totalH}`);

    const maxAbs = d3.max(data, d => Math.abs(d.value)) || 0.01;
    x.domain([-maxAbs * 1.12, maxAbs * 1.12]).range([0, innerW]).nice();

    const xTicks = x.ticks(6);
    gGrid.selectAll("line")
      .data(xTicks)
      .join("line")
      .attr("class", "gridline")
      .attr("x1", d => x(d)).attr("x2", d => x(d))
      .attr("y1", 0).attr("y2", innerH);

    gAxis.attr("transform", `translate(0,${innerH})`)
      .call(d3.axisBottom(x).tickValues(xTicks).tickFormat(d3.format("+.0%")).tickSizeOuter(0));
    gAxis.selectAll("text").attr("dy", "1.4em");

    baselineLine
      .attr("x1", x(0)).attr("x2", x(0))
      .attr("y1", 0).attr("y2", innerH)
      .attr("stroke", "var(--baseline)")
      .attr("stroke-width", 1);

    const maxLabelChars = Math.max(8, Math.floor((margin.left - 16) / 7.2));

    // Row hover backgrounds
    const rowBg = gBars.selectAll("rect.bar-row-bg").data(data, d => d.location_id);
    rowBg.exit().remove();
    const rowBgEnter = rowBg.enter().append("rect").attr("class", "bar-row-bg");
    rowBgEnter.merge(rowBg)
      .attr("x", -margin.left).attr("width", innerW + margin.left + margin.right)
      .attr("y", (d, i) => i * rowH).attr("height", rowH)
      .on("mouseenter", function(event, d){
        d3.select(this).classed("hover", true);
        const pct = fmtPct(d.value);
        tooltip.html(
          `<div><b>${d.location_name}</b></div>` +
          `<div>${d.location_type}</div>` +
          `<div>Actual vs. ${currentBasis === "natl" ? "national average" : "market-specific"} trend: <b>${pct}</b></div>`
        );
        positionTooltip(event);
        tooltip.style("opacity", 1);
      })
      .on("mousemove", positionTooltip)
      .on("mouseleave", function(){
        d3.select(this).classed("hover", false);
        tooltip.style("opacity", 0);
      });

    function positionTooltip(event){
      const bbox = container.node().getBoundingClientRect();
      const left = event.clientX - bbox.left + 14;
      const top = event.clientY - bbox.top + 14;
      const ttRect = tooltip.node().getBoundingClientRect();
      const clampedLeft = Math.max(4, Math.min(left, bbox.width - ttRect.width - 4));
      tooltip.style("left", `${clampedLeft}px`).style("top", `${top}px`);
    }

    // Bars
    const bars = gBars.selectAll("path.bar").data(data, d => d.location_id);
    bars.exit().remove();
    const barsEnter = bars.enter().append("path").attr("class", "bar");
    barsEnter.merge(bars)
      .attr("d", (d, i) => {
        const yTop = i * rowH + (rowH - barThick) / 2;
        const yBot = yTop + barThick;
        return roundedBarPath(x(0), x(d.value), yTop, yBot, 4);
      })
      .attr("fill", d => d.value >= 0 ? "var(--pos)" : "var(--neg)");

    // Row (location name) labels, left of the zero baseline in the margin
    const rowLabels = gLabels.selectAll("text.row-label").data(data, d => d.location_id);
    rowLabels.exit().remove();
    const rowLabelsEnter = rowLabels.enter().append("text").attr("class", "row-label");
    rowLabelsEnter.merge(rowLabels)
      .attr("x", -12)
      .attr("y", (d, i) => i * rowH + rowH / 2)
      .attr("dy", "0.32em")
      .attr("text-anchor", "end")
      .text(d => truncate(d.location_name, maxLabelChars))
      .append("title");
    gLabels.selectAll("text.row-label").select("title").text(d => d.location_name);

    // Value labels at the tip of each bar
    const valueLabels = gLabels.selectAll("text.value-label").data(data, d => d.location_id);
    valueLabels.exit().remove();
    const valueLabelsEnter = valueLabels.enter().append("text").attr("class", "value-label");
    valueLabelsEnter.merge(valueLabels)
      .attr("y", (d, i) => i * rowH + rowH / 2)
      .attr("dy", "0.32em")
      .attr("x", d => x(d.value) + (d.value >= 0 ? 6 : -6))
      .attr("text-anchor", d => d.value >= 0 ? "start" : "end")
      .text(d => fmtPct(d.value));

    document.getElementById("note").textContent =
      `Showing ${n} ${currentType === "Metro" ? "metros" : currentType === "City" ? "cities" : "states"}` +
      (currentType !== "State" ? " (largest by population, with full 2017–present coverage)." : ".");
  }

  document.getElementById("typeSelect").addEventListener("change", (e) => {
    currentType = e.target.value;
    render();
  });

  document.querySelectorAll("#basisToggle button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#basisToggle button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentBasis = btn.dataset.basis;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
