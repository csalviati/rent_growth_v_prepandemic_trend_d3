<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rent Gap vs. Pre-Pandemic Trend</title>

  <style>
    .viz-root{
      color-scheme: light;
      --surface-1:      #f5f2ed;
      --page-plane:     #f5f2ed;
      --text-primary:   #0b0b0b;
      --text-secondary: #52514e;
      --text-muted:     #898781;
      --gridline:       #ded9cf;
      --baseline:       #b8b2a5;
      --pos:            #b2182b;
      --neg:            #2166ac;
      --border:         rgba(11,11,11,0.10);
      --purple:         #8434D6;
    }

    body{
      margin:0;
      background:var(--page-plane);
      font-family: "Proxima Nova", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--text-primary);
    }

    .wrap{
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 10px 14px 8px 14px;
      box-sizing: border-box;
      background: var(--surface-1);
    }

    .title{ text-align:left; margin: 2px 0 0 0; }
    .title .l1{ font-size:23px; font-weight:600; margin-bottom:2px; }
    .title .l2{ font-size:17px; font-weight:400; color:var(--text-secondary); }

    .controls{
      display:flex;
      align-items:flex-end;
      gap:14px;
      flex-wrap:nowrap;
      margin: 8px 0 8px 0;
    }
    .control-group{ display:flex; flex-direction:column; gap:3px; flex: 1 1 0; min-width:0; }
    .control-group label{ font-size:12px; color:var(--text-secondary); font-weight:600; }
    select{
      font-size:13px;
      padding:5px 7px;
      border:1px solid rgba(0,0,0,0.2);
      border-radius:8px;
      background:#fff;
      font-family: inherit;
      color: var(--text-primary);
      width:100%;
      box-sizing:border-box;
    }

    /* Fixed-height, independently scrollable chart area */
    #chartScroll{
      position:relative;
      width:100%;
      max-height: 480px;
      overflow-y: auto;
      overflow-x: hidden;
      border: 1px solid var(--gridline);
      border-radius: 8px;
    }
    #chart{ position:relative; width:100%; display:block; }

    .row-label{ font-size:13px; fill: var(--text-primary); }
    .value-label{ font-size:12px; fill: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .axis text{ font-size:12px; fill: var(--text-muted); }
    .axis path, .axis line{ stroke: var(--baseline); }
    .gridline{ stroke: var(--gridline); shape-rendering: crispEdges; }

    .bar-row-bg{ fill: transparent; }
    .bar-row-bg.hover{ fill: rgba(11,11,11,0.035); }

    .legend-in-chart text{ font-size:12px; fill: var(--text-secondary); }

    .tooltip{
      position:absolute;
      pointer-events:none;
      background: rgba(255,255,255,0.96);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 13px;
      line-height: 1.3;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      opacity: 0;
      white-space: nowrap;
      z-index: 40;
    }

    .footer{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-top:8px;
      gap:12px;
    }
    .source{ font-size:13px; color:var(--text-secondary); }
    .logo{ height:34px; width:auto; display:block; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>

<body>
  <div class="wrap viz-root" id="vizRoot">
    <div class="title">
      <div class="l1" id="titleL1">Median Rent vs. Pre-Pandemic Trend</div>
      <div class="l2" id="titleL2">Loading…</div>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="typeSelect">Location type</label>
        <select id="typeSelect">
          <option value="Metro" selected>Metro</option>
          <option value="State">State</option>
          <option value="City">City</option>
        </select>
      </div>
      <div class="control-group">
        <label for="basisSelect">Compare to</label>
        <select id="basisSelect">
          <option value="natl" selected>National average trend</option>
          <option value="own">Market-specific trend</option>
        </select>
      </div>
      <div class="control-group">
        <label for="showSelect">Show</label>
        <select id="showSelect">
          <option value="25" selected>25 largest</option>
          <option value="50">50 largest</option>
          <option value="100">100 largest</option>
        </select>
      </div>
    </div>

    <div id="chartScroll">
      <div id="chart"></div>
    </div>

    <div class="footer">
      <div class="source">Source: Apartment List</div>
      <img class="logo" src="Apartment_List_Logo_RGB%20crop.png" alt="Apartment List logo" />
    </div>
  </div>

<script>
(async function() {
  const CSV_PATH = "final_df.csv";
  const num = (v) => (v === "" || v == null ? null : +v);
  const fmtMonthYear = d3.timeFormat("%B %Y");
  const fmtPct = d3.format("+.1%");
  const fmtDollar0 = (v) => d3.format("$,.0f")(v);
  const TYPE_PLURAL = { Metro: "Metros", State: "States", City: "Cities" };

  const raw = await d3.csv(CSV_PATH, d => ({
    location_id: +d.location_id,
    location_type: d.location_type,
    location_name: d.location_name,
    population: num(d.population),
    date: new Date(+d.year, (+d.month - 1), 1),
    price_all_actual: num(d.price_all_actual),
    price_all_prepan_trnd: num(d.price_all_prepan_trnd),
    price_all_prepan_trnd_natl: num(d.price_all_prepan_trnd_natl)
  }));

  const latestDate = d3.max(raw, d => d.date);
  const latestLabel = fmtMonthYear(latestDate);
  const latestRows = raw.filter(d => d.date.getTime() === latestDate.getTime());

  const byLocation = latestRows
    .filter(d => d.location_type !== "National")
    .map(d => {
      const diffOwn = (d.price_all_actual != null && d.price_all_prepan_trnd)
        ? d.price_all_actual / d.price_all_prepan_trnd - 1 : null;
      const diffNatl = (d.price_all_actual != null && d.price_all_prepan_trnd_natl)
        ? d.price_all_actual / d.price_all_prepan_trnd_natl - 1 : null;
      return {
        location_id: d.location_id,
        location_type: d.location_type,
        location_name: d.location_name,
        population: d.population,
        actual: d.price_all_actual,
        trendOwn: d.price_all_prepan_trnd,
        trendNatl: d.price_all_prepan_trnd_natl,
        diffOwn, diffNatl
      };
    });

  let currentType = "Metro";
  let currentBasis = "natl";
  let currentShowN = 25;

  const container = d3.select("#chart");
  const tooltip = d3.select("#chartScroll").append("div").attr("class", "tooltip");

  const margin = { top: 6, right: 68, bottom: 30, left: 220 };
  const rowH = 22;
  const barThick = 16;
  const viewW = 860;
  const innerW = viewW - margin.left - margin.right;

  const svg = container.append("svg")
    .attr("role", "img")
    .attr("aria-label", "Ranked bar chart of rent gap vs. pre-pandemic trend")
    .attr("preserveAspectRatio", "none")
    .style("width", "100%")
    .style("display", "block");

  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
  const gGrid = g.append("g").attr("class", "gridlines");
  const gBars = g.append("g").attr("class", "bars");
  const gLabels = g.append("g").attr("class", "labels");
  const gAxis = g.append("g").attr("class", "axis");
  const baselineLine = g.append("line").attr("class", "axis");

  // In-chart legend, pinned to the top-left corner of the plot area
  const legend = g.append("g").attr("class", "legend-in-chart");
  const legendBg = legend.append("rect").attr("rx", 6).attr("ry", 6).attr("fill", "rgba(255,255,255,0.8)");
  const legendRow1 = legend.append("g");
  const legendRow2 = legend.append("g");
  [legendRow1, legendRow2].forEach(row => { row.append("rect"); row.append("text"); });

  const x = d3.scaleLinear();

  function roundedBarPath(xZero, xVal, yTop, yBot, r){
    const positive = xVal >= xZero;
    const rr = Math.min(r, Math.abs(xVal - xZero) / 2 || r, (yBot - yTop) / 2);
    if (positive){
      const x0 = xZero, x1 = xVal;
      if (x1 - x0 < rr * 2) return `M${x0},${yTop} L${x1},${yTop} L${x1},${yBot} L${x0},${yBot} Z`;
      return `M${x0},${yTop} L${x1 - rr},${yTop} Q${x1},${yTop} ${x1},${yTop + rr} L${x1},${yBot - rr} Q${x1},${yBot} ${x1 - rr},${yBot} L${x0},${yBot} Z`;
    } else {
      const x0 = xZero, x1 = xVal;
      if (x0 - x1 < rr * 2) return `M${x0},${yTop} L${x1},${yTop} L${x1},${yBot} L${x0},${yBot} Z`;
      return `M${x0},${yTop} L${x1 + rr},${yTop} Q${x1},${yTop} ${x1},${yTop + rr} L${x1},${yBot - rr} Q${x1},${yBot} ${x1 + rr},${yBot} L${x0},${yBot} Z`;
    }
  }

  function truncate(str, maxChars){
    if (str.length <= maxChars) return str;
    return str.slice(0, Math.max(0, maxChars - 1)).trimEnd() + "…";
  }

  function render(){
    const basisKey = currentBasis === "natl" ? "diffNatl" : "diffOwn";
    const trendKey = currentBasis === "natl" ? "trendNatl" : "trendOwn";
    let data = byLocation
      .filter(d => d.location_type === currentType && d[basisKey] != null)
      .map(d => ({ ...d, value: d[basisKey], trendVal: d[trendKey] }));

    const hasPopulation = data.some(d => d.population != null);
    if (hasPopulation){
      data = data.slice().sort((a, b) => (b.population ?? 0) - (a.population ?? 0)).slice(0, currentShowN);
    }

    data.sort((a, b) => b.value - a.value);

    const n = data.length;
    const innerH = Math.max(n, 1) * rowH;
    const contentH = innerH + margin.top + margin.bottom;

    // preserveAspectRatio="none" lets width and height scale independently, so
    // the SVG's pixel height always equals contentH exactly -- no letterboxing.
    svg.attr("viewBox", `0 0 ${viewW} ${contentH}`).attr("height", contentH);

    document.getElementById("titleL2").textContent =
      `Percentage gap between actual and pre-pandemic trend, ${latestLabel}`;
    document.getElementById("titleL1").textContent =
      `Median Rent vs. Pre-Pandemic Trend: ${n} Largest ${TYPE_PLURAL[currentType] || currentType}`;

    const maxAbs = d3.max(data, d => Math.abs(d.value)) || 0.01;
    x.domain([-maxAbs * 1.12, maxAbs * 1.12]).range([0, innerW]).nice();

    const xTicks = x.ticks(6);
    gGrid.selectAll("line")
      .data(xTicks)
      .join("line")
      .attr("class", "gridline")
      .attr("x1", d => x(d)).attr("x2", d => x(d))
      .attr("y1", 0).attr("y2", innerH);

    gAxis.attr("transform", `translate(0,${innerH})`)
      .call(d3.axisBottom(x).tickValues(xTicks).tickFormat(d3.format("+.0%")).tickSizeOuter(0));
    gAxis.selectAll("text").attr("dy", "1.4em");

    baselineLine
      .attr("x1", x(0)).attr("x2", x(0))
      .attr("y1", 0).attr("y2", innerH)
      .attr("stroke", "var(--baseline)")
      .attr("stroke-width", 1);

    // Legend (top-left of plot area)
    const legItems = [
      { label: "Actual above trend", color: "var(--pos)" },
      { label: "Actual below trend", color: "var(--neg)" }
    ];
    const legRows = [legendRow1, legendRow2];
    legItems.forEach((item, i) => {
      legRows[i].attr("transform", `translate(8, ${8 + i * 18})`);
      legRows[i].select("rect").attr("width", 11).attr("height", 11).attr("rx", 2).attr("y", -9).attr("fill", item.color);
      legRows[i].select("text").attr("x", 16).attr("y", 0).text(item.label);
    });
    legendBg.attr("x", 2).attr("y", 2).attr("width", 150).attr("height", 8 + legItems.length * 18 + 2);

    const maxLabelChars = Math.max(8, Math.floor((margin.left - 16) / 6.6));

    const rowBg = gBars.selectAll("rect.bar-row-bg").data(data, d => d.location_id);
    rowBg.exit().remove();
    const rowBgEnter = rowBg.enter().append("rect").attr("class", "bar-row-bg");
    rowBgEnter.merge(rowBg)
      .attr("x", -margin.left).attr("width", innerW + margin.left + margin.right)
      .attr("y", (d, i) => i * rowH).attr("height", rowH)
      .on("mouseenter", function(event, d){
        d3.select(this).classed("hover", true);
        const trendLabel = currentBasis === "natl" ? "National average trend" : "Market-specific trend";
        tooltip.html(
          `<div><b>${d.location_name}</b></div>` +
          `<div>Actual: <b>${fmtDollar0(d.actual)}</b></div>` +
          `<div>${trendLabel}: <b>${fmtDollar0(d.trendVal)}</b></div>` +
          `<div>Difference: <b>${fmtPct(d.value)}</b></div>`
        );
        positionTooltip(event);
        tooltip.style("opacity", 1);
      })
      .on("mousemove", positionTooltip)
      .on("mouseleave", function(){
        d3.select(this).classed("hover", false);
        tooltip.style("opacity", 0);
      });

    function positionTooltip(event){
      const scrollEl = document.getElementById("chartScroll");
      const bbox = scrollEl.getBoundingClientRect();
      const left = event.clientX - bbox.left + scrollEl.scrollLeft + 14;
      const top = event.clientY - bbox.top + scrollEl.scrollTop + 14;
      const ttRect = tooltip.node().getBoundingClientRect();
      const clampedLeft = Math.max(4, Math.min(left, scrollEl.scrollWidth - ttRect.width - 4));
      tooltip.style("left", `${clampedLeft}px`).style("top", `${top}px`);
    }

    const bars = gBars.selectAll("path.bar").data(data, d => d.location_id);
    bars.exit().remove();
    const barsEnter = bars.enter().append("path").attr("class", "bar");
    barsEnter.merge(bars)
      .attr("d", (d, i) => {
        const yTop = i * rowH + (rowH - barThick) / 2;
        const yBot = yTop + barThick;
        return roundedBarPath(x(0), x(d.value), yTop, yBot, 4);
      })
      .attr("fill", d => d.value >= 0 ? "var(--pos)" : "var(--neg)");

    const rowLabels = gLabels.selectAll("text.row-label").data(data, d => d.location_id);
    rowLabels.exit().remove();
    const rowLabelsEnter = rowLabels.enter().append("text").attr("class", "row-label");
    rowLabelsEnter.merge(rowLabels)
      .attr("x", -12)
      .attr("y", (d, i) => i * rowH + rowH / 2)
      .attr("dy", "0.32em")
      .attr("text-anchor", "end")
      .text(d => truncate(d.location_name, maxLabelChars))
      .append("title");
    gLabels.selectAll("text.row-label").select("title").text(d => d.location_name);

    const valueLabels = gLabels.selectAll("text.value-label").data(data, d => d.location_id);
    valueLabels.exit().remove();
    const valueLabelsEnter = valueLabels.enter().append("text").attr("class", "value-label");
    valueLabelsEnter.merge(valueLabels)
      .attr("y", (d, i) => i * rowH + rowH / 2)
      .attr("dy", "0.32em")
      .attr("x", d => x(d.value) + (d.value >= 0 ? 6 : -6))
      .attr("text-anchor", d => d.value >= 0 ? "start" : "end")
      .text(d => fmtPct(d.value));
  }

  document.getElementById("typeSelect").addEventListener("change", (e) => { currentType = e.target.value; render(); });
  document.getElementById("basisSelect").addEventListener("change", (e) => { currentBasis = e.target.value; render(); });
  document.getElementById("showSelect").addEventListener("change", (e) => { currentShowN = +e.target.value; render(); });

  render();
})();
</script>
</body>
</html>
